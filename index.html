<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移動友好應用</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        * {
            font-family: 'Noto Sans TC', sans-serif;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animated-bg {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #475569);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .button-scale {
            transform: scale(1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .button-scale:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3),
                       0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .text-gradient {
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientBG 15s ease infinite;
            background-size: 200% 200%;
        }

        .glow {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .button-container {
            position: relative;
            transition: transform 0.3s ease;
        }

        .button-container:hover::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #60a5fa, #a78bfa, #f472b6);
            border-radius: 16px;
            z-index: -1;
            filter: blur(8px);
            animation: gradientBG 3s ease infinite;
        }
    </style>
</head>
<body class="bg-gray-900">
    <div id="app" class="min-h-screen animated-bg transition-colors duration-500">
        <div class="container mx-auto px-4 py-16">
            <div class="max-w-4xl mx-auto">
                <h1 id="welcomeText" class="text-7xl font-black text-center mb-16 text-gradient opacity-0 transform -translate-y-12 transition duration-1000 tracking-wider floating">
                    歡迎使用
                </h1>

                <div class="space-y-8 px-4">
                    <div class="button-container">
                        <button class="relative w-full px-8 py-8 glass-effect rounded-2xl transition-all duration-300 button-scale glow group" onclick="handleButtonClick(this, 'https://tmjh113.github.io/test/')">
                            <span class="flex items-center justify-between">
                                <span class="flex items-center text-2xl font-bold text-white group-hover:text-blue-200 transition-colors duration-300">
                                    <svg class="w-8 h-8 mr-4 transform group-hover:rotate-12 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7m0-18H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7m0-18v18"></path>
                                    </svg>
                                    專屬系統
                                </span>
                                <svg class="w-8 h-8 transform group-hover:translate-x-2 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </span>
                        </button>
                    </div>

                    <div class="button-container">
                        <button class="relative w-full px-8 py-8 glass-effect rounded-2xl transition-all duration-300 button-scale glow group" onclick="handleButtonClick(this, 'https://tmjh113.github.io/tmjh113/vote.html')">
                            <span class="flex items-center justify-between">
                                <span class="flex items-center text-2xl font-bold text-white group-hover:text-purple-200 transition-colors duration-300">
                                    <svg class="w-8 h-8 mr-4 transform group-hover:rotate-12 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 4v10a2 2 0 0 1-2 2H8l-4 4V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path>
                                    </svg>
                                    立即投票
                                </span>
                                <svg class="w-8 h-8 transform group-hover:translate-x-2 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </span>
                        </button>
                    </div>

                    <div class="button-container">
                        <button class="relative w-full px-8 py-8 glass-effect rounded-2xl transition-all duration-300 button-scale glow group" onclick="handleButtonClick(this, 'https://tmjh113.github.io/tmjhsafe/')">
                            <span class="flex items-center justify-between">
                                <span class="flex items-center text-2xl font-bold text-white group-hover:text-green-200 transition-colors duration-300">
                                    <svg class="w-8 h-8 mr-4 transform group-hover:rotate-12 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                    </svg>
                                    天中乾淨規範
                                </span>
                                <svg class="w-8 h-8 transform group-hover:translate-x-2 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase imports and configuration remain the same
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDAw3LKSDHHwasOhN0l63lO4I-AO1xeGGU",
            authDomain: "tmjh113.firebaseapp.com",
            projectId: "tmjh113",
            storageBucket: "tmjh113.appspot.com",
            messagingSenderId: "936878916477",
            appId: "1:936878916477:web:cbff479db9898b0a218214",
            measurementId: "G-J5WT01ZLBD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const appElement = document.getElementById('app');
        const welcomeText = document.getElementById('welcomeText');

        setTimeout(() => {
            welcomeText.classList.remove('opacity-0', '-translate-y-12');
        }, 500);

        window.handleButtonClick = async function(button, redirectUrl) {
            button.classList.add('relative', 'overflow-hidden');
            
            // Add loading spinner
            const spinner = document.createElement('div');
            spinner.className = 'absolute inset-0 flex items-center justify-center bg-gray-800 dark:bg-white';
            spinner.innerHTML = '<div class="w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>';
            button.appendChild(spinner);

            try {
                const timestamp = new Date().toLocaleString('zh-TW', { hour12: false });
                const buttonText = button.querySelector('.flex.items-center.text-2xl').textContent.trim();

                await addDoc(collection(db, 'clicks'), {
                    timestamp: `時間: ${timestamp}`,
                    button: buttonText,
                    redirectUrl: redirectUrl
                });

                // Show success checkmark
                spinner.innerHTML = '<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';

                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);

            } catch (error) {
                console.error("Error:", error);
                spinner.remove();
            }
        };
    </script>
</body>
</html>
